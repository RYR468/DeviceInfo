name: DeviceInfo
options:
  bundleIdPrefix: com.ryr          # 改成你自己的前缀；改了之后保持稳定（AltStore 续签要靠 Bundle ID）
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: "5.0"           # 用 Swift 5 语言模式，规避并发严格检查导致编译失败
    TARGETED_DEVICE_FAMILY: "1"    # 仅 iPhone
targets:
  DeviceInfo:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 设备信息
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        # 自定义 URL Scheme：作为 Action Button 触发的双保险（deviceinfo://）
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.ryr.DeviceInfo
            CFBundleURLSchemes: [deviceinfo]
        LSApplicationCategoryType: public.app-category.utilities
